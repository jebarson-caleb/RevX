name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The opt-in physical-testing backend must compile and lint, though CI never arms it.
      - run: cargo clippy -p nousb --all-targets --features real-linux-boot -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p nousb -- catalog validate
      - run: cargo run -p nousb -- boot plan ubuntu-24.04-desktop
      - run: cargo run -p nousb -- boot status
      - run: cargo run -p nousb -- --json image manifest ubuntu-24.04-desktop
      - run: cargo run -p nousb -- --json image manifest fedora-44-workstation
      - run: cargo run -p nousb -- --json vm doctor
      - run: cargo run -p nousb -- --json vm rehearse uefi-bootnext ubuntu-24.04-desktop
      - run: cargo run -p nousb -- workflow assess-fake windows-bitlocker ubuntu-24.04-desktop
      - run: cargo run -p nousb -- system inspect-fake windows-bitlocker
      - run: cargo run -p nousb -- plan-fake linux-luks-low-space boot-once ubuntu-24.04-desktop
      - run: cargo run -p nousb -- --interrupt-after 2 simulate boot-once ubuntu-24.04-desktop
      - run: cargo run -p nousb -- reports list
      - run: cargo run -p nousb -- diagnostics export
      - run: cargo run -p nousb -- dashboard export

  # The disposable QEMU harness and Windows inventory adapter only compile on Windows.
  # This job never starts a VM: the runtime and ISO are absent, so every plan fails closed.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p nousb --all-targets --features real-windows-boot -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p nousb -- --json vm qemu plan-runtime
      - run: cargo run -p nousb -- boot plan ubuntu-24.04-desktop

  # The Tauri command bridge is a standalone crate (apps/desktop/src-tauri) so the main jobs
  # need no WebView libraries. It exposes only read-only and simulation commands.
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - working-directory: apps/desktop
        run: npx --yes pnpm@10.18.3 install --frozen-lockfile
      - working-directory: apps/desktop
        run: npx --yes pnpm@10.18.3 run build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --features real-boot -- -D warnings
